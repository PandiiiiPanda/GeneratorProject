<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101c18">
    <link rel="stylesheet" href="assets/styles.css">
    <title>Project Generator</title>
</head>
<body>
    <main class="generator">
        <header class="generator__header">
            <div class="brand" aria-label="Project Generator">
                <img src="assets/img/logo.png" alt="dice logo" width="50" height="50">
                <span class="brand__name">Project Generator</span>
            </div>
        </header>

        <section class="generator__content" aria-labelledby="page-title">
            <p class="eyebrow"><span></span> Idée du jour</p>
            <h1 id="page-title">À vous de jouer.</h1>
            <p class="intro">Faites tourner la roue et trouvez votre prochain défi créatif.</p>

            <div class="roulette-shell">
                <div class="roulette-shell__notch" aria-hidden="true"></div>
                <div id="roulette" role="status" aria-live="polite"></div>
            </div>

            <button id="start" type="button">
                <span class="start-label">Générer un projet</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </button>
        </section>

        <footer class="generator__footer">
            <span>47 défis disponibles</span>
            <span class="footer-line" aria-hidden="true"></span>
            <span id="result-count">Prêt</span>
        </footer>
    </main>

    <script src="assets/scripts.js"></script>
</body>
</html>
